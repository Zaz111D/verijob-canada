# Chaque semaine (et à chaque modification de main) :
#   1. tests et vérification TypeScript ;
#   2. téléchargement poli des données officielles (pipeline) ;
#   3. construction de la PWA et publication gratuite sur GitHub Pages.
# Un job séparé échoue si une règle de data/rules.json a dépassé sa date de révision :
# GitHub envoie alors un e-mail au propriétaire du dépôt.
name: Données et déploiement

on:
  schedule:
    - cron: '0 6 * * 1' # chaque lundi à 6 h UTC
    - cron: '0 6 * * 4' # chaque jeudi : tracker international seulement (ADZUNA_REFRESH=international)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # pour publier la release « site-latest » (site construit, utilisé par Cloudflare)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests et typage
        run: |
          npm test
          npm run typecheck
      # Fichiers bruts gardés une semaine : évite de retélécharger ce qui n'a pas changé.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Pipeline de données (open.canada.ca, Statistique Canada)
        run: npm run data
        env:
          # Facultatif : offres ouvertes aux candidats de l'étranger (API Adzuna, accès gratuit). Sans clés, étape sautée.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Quota gratuit : l'API Adzuna n'est appelée que le lundi (ou lancement manuel) ; à chaque envoi de code,
          # les offres déjà publiées sont reprises (scripts/lib/previous.ts).
          # Jeudi : seulement le tracker international (2e mise à jour de la semaine, quota respecté).
          ADZUNA_REFRESH: ${{ github.event_name == 'push' && 'false' || (github.event.schedule == '0 6 * * 4' && 'international' || 'true') }}
      # Mise à jour automatique (lundi, jeudi) : le rapport de données est enregistré dans le dépôt. Ce commit
      # déclenche la reconstruction Cloudflare (qui ne suit que les envois sur main) ; la release publiée plus bas
      # porte ce commit, que Cloudflare attend. Sans cela, les données du lundi n'arrivaient en ligne qu'au prochain
      # envoi de code (constaté le 13 nov. 2026). Le commit de GITHUB_TOKEN ne relance pas ce workflow.
      - name: Enregistrer le rapport de données (met le site à jour sur Cloudflare)
        id: data_commit
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data-report.md
          if git commit -q -m "Données du $(date -u +%Y-%m-%d) (mise à jour automatique)" && git push -q origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Rapport inchangé ou envoi impossible : la release gardera le commit $GITHUB_SHA."
          fi
      - name: Construction de la PWA
        run: |
          node scripts/make-icons.mjs
          npm run build -w @verijob/pwa
      # Le site construit est publié dans une release publique : Cloudflare le récupère tel quel
      # (ses serveurs de construction sont bloqués par Statistique Canada).
      - name: Publier le site construit (release « site-latest »)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_SHA: ${{ steps.data_commit.outputs.sha }}
        run: |
          # Commit construit : Cloudflare attend que la release corresponde à son propre commit.
          printf '{"commit":"%s","builtAt":"%s"}\n' "${DATA_SHA:-$GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apps/pwa/dist/build-info.json
          (cd apps/pwa/dist && zip -qr "$GITHUB_WORKSPACE/site.zip" .)
          gh release view site-latest >/dev/null 2>&1 || gh release create site-latest --title "Site construit (automatique)" --notes "Mis à jour par le workflow « Données et déploiement ». Utilisé par Cloudflare." --latest=false
          gh release upload site-latest site.zip --clobber
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare (Workers ou Pages) : redéploie le site construit ci-dessus.
  # Facultatif : ne fait rien tant que le secret CLOUDFLARE_DEPLOY_HOOK n'est pas défini
  # (Settings → Secrets and variables → Actions sur GitHub).
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la reconstruction Cloudflare Pages
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Pas de CLOUDFLARE_DEPLOY_HOOK : étape ignorée."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Reconstruction Cloudflare demandée."

  regles:
    name: Règles à revérifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dates de révision de data/rules.json
        run: node scripts/check-rules.mjs
